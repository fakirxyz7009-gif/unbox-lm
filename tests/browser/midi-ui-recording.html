<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unbox workstation MIDI recording UI probe</title>
    <style>
      #result {
        position: fixed;
        z-index: 2147483647;
        top: 12px;
        right: 12px;
        width: min(680px, calc(100vw - 24px));
        max-height: 24vh;
        overflow: auto;
        box-sizing: border-box;
        margin: 0;
        padding: 12px 16px;
        border: 1px solid #b58a50;
        border-radius: 8px;
        background: rgb(12 15 19 / 94%);
        box-shadow: 0 6px 24px rgb(0 0 0 / 55%);
        color: #f3e8d0;
        font: 600 14px/1.45 system-ui, sans-serif;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        pointer-events: none;
      }

      #result[data-status="passed"] {
        border-color: #45c98b;
      }

      #result[data-status="failed"] {
        border-color: #ed6868;
        color: #ffe0e0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <pre id="result" data-status="running" role="status" aria-live="polite">Running workstation MIDI recording UI probe…</pre>
    <script type="module" src="./midi-ui-recording.ts"></script>
  </body>
</html>
